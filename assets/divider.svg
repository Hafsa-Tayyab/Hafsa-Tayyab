<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="1000" height="44" role="img"><title>divider</title><defs></defs><style>
.sp{animation:sp 3.4s ease-in-out infinite}
@keyframes sp{0%,100%{transform:scale(.15) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.s1{animation:sw 4.6s ease-in-out infinite alternate}
.s2{animation:sw 5.7s ease-in-out infinite alternate -1.7s}
.s3{animation:sw 6.5s ease-in-out infinite alternate -3.1s}
@keyframes sw{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.flap{animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.22)}}
.pt{animation:pt 18s linear infinite}
@keyframes pt{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.9}50%{transform:translate(35px,200px) rotate(200deg)}92%{opacity:.9}100%{transform:translate(-60px,420px) rotate(420deg);opacity:0}}
.mist{animation:mist 26s ease-in-out infinite alternate}
@keyframes mist{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
.bk{animation:bk 16s ease-in-out infinite alternate}
@keyframes bk{from{transform:translate(0,0)}to{transform:translate(16px,-28px)}}
.bob{animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.spin{animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.glw{animation:glw 4s ease-in-out infinite alternate}
@keyframes glw{from{opacity:.55}to{opacity:1}}
